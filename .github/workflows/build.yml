name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Dependencies
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/jniLibs/arm64-v8a
        
        # ۱. دانلود Alpine
        curl -fL -o app/src/main/assets/alpine.tar.gz "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-3.21.3-aarch64.tar.gz"
        
        # ۲. کپی کردن PRoot استاتیک از assets به jniLibs (بدون دانلود داینامیک)
        cp app/src/main/assets/proot app/src/main/jniLibs/arm64-v8a/libproot.so
        chmod +x app/src/main/jniLibs/arm64-v8a/libproot.so

    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin', cache: gradle }
    - run: chmod +x gradlew
    - run: ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with: { name: app-debug, path: app/build/outputs/apk/debug/app-debug.apk }
