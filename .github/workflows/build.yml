name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download and Setup PRoot & Alpine
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/jniLibs/arm64-v8a
        # دانلود PRoot
        wget https://packages.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.1.107.87_aarch64.deb
        ar x proot_5.1.107.87_aarch64.deb
        # استخراج با فلگ‌های صحیح برای جلوگیری از خطای دسترسی
        tar -xf data.tar.xz --no-same-owner --no-same-permissions
        # کپی PRoot به jniLibs (نه assets) و تغییر نام به .so
        cp data/data/com.termux/files/usr/bin/proot app/src/main/jniLibs/arm64-v8a/libproot.so
        # کپی لودر PRoot
        cp data/data/com.termux/files/usr/libexec/proot/loader app/src/main/jniLibs/arm64-v8a/libproot_loader.so
        # دانلود Alpine
        wget https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-3.21.3-aarch64.tar.gz -O app/src/main/assets/alpine.tar.gz

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
