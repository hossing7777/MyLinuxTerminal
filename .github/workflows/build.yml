name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download Alpine Rootfs
      run: |
        mkdir -p app/src/main/assets
        curl -fL -o app/src/main/assets/alpine.tar.gz "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-3.21.3-aarch64.tar.gz"
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin', cache: gradle }
    - run: chmod +x gradlew
    - run: ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with: { name: app-debug, path: app/build/outputs/apk/debug/app-debug.apk }
