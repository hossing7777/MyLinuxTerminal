name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Dependencies
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/jniLibs/arm64-v8a
        
        # ۱. دانلود Alpine
        curl -fL -o app/src/main/assets/alpine.tar.gz "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-3.21.3-aarch64.tar.gz"
        
        # ۲. دانلود PRoot و کتابخانه‌ها
        curl -fL -o proot.deb "https://mirrors.aliyun.com/termux/termux-main/pool/main/p/proot/proot_5.1.107.101_aarch64.deb"
        ar x proot.deb && tar -xf data.tar.xz --no-same-owner --no-same-permissions
        cp data/data/com.termux/files/usr/bin/proot app/src/main/jniLibs/arm64-v8a/libproot.so
        cp data/data/com.termux/files/usr/libexec/proot/loader app/src/main/jniLibs/arm64-v8a/libproot_loader.so
        
        curl -fL -o talloc.deb "https://mirrors.aliyun.com/termux/termux-main/pool/main/libt/libtalloc/libtalloc_2.5.0_aarch64.deb"
        ar x talloc.deb && tar -xf data.tar.xz --no-same-owner --no-same-permissions
        cp data/data/com.termux/files/usr/lib/libtalloc.so.2 app/src/main/jniLibs/arm64-v8a/libtalloc.so
        
        curl -fL -o shmem.deb "https://mirrors.aliyun.com/termux/termux-main/pool/main/liba/libandroid-shmem/libandroid-shmem_0.7_aarch64.deb"
        ar x shmem.deb && tar -xf data.tar.xz --no-same-owner --no-same-permissions
        cp data/data/com.termux/files/usr/lib/libandroid-shmem.so app/src/main/jniLibs/arm64-v8a/libandroid-shmem.so
        
        sudo apt-get update && sudo apt-get install -y patchelf
        patchelf --replace-needed libtalloc.so.2 libtalloc.so app/src/main/jniLibs/arm64-v8a/libproot.so
        chmod +x app/src/main/jniLibs/arm64-v8a/libproot.so
        chmod +x app/src/main/jniLibs/arm64-v8a/libproot_loader.so

        # ۳. دانلود فایل‌های xterm.js برای اجرای آفلاین
        curl -fL -o app/src/main/assets/xterm.css "https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
        curl -fL -o app/src/main/assets/xterm.js "https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"
        curl -fL -o app/src/main/assets/xterm-addon-fit.js "https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"

    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin', cache: gradle }
    - run: chmod +x gradlew
    - run: ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with: { name: app-debug, path: app/build/outputs/apk/debug/app-debug.apk }
