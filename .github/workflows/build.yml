name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download and Setup PRoot & Alpine
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/jniLibs/arm64-v8a
        
        echo "Downloading PRoot..."
        PROOT_URL="https://mirror.bouwhuis.network/termux/apt/apt/apt/termux-main/pool/main/p/proot/proot_5.1.107.98_aarch64.deb"
        curl -fL -o proot.deb "$PROOT_URL"
        
        FILE_SIZE=$(stat -c%s proot.deb)
        echo "Downloaded PRoot size: $FILE_SIZE bytes"
        if [ "$FILE_SIZE" -lt 50000 ]; then
          echo "Error: Downloaded PRoot file is too small. Download likely failed."
          cat proot.deb
          exit 1
        fi

        echo "Extracting PRoot..."
        ar x proot.deb
        tar -xf data.tar.xz --no-same-owner --no-same-permissions
        
        echo "Copying PRoot to jniLibs..."
        cp data/data/com.termux/files/usr/bin/proot app/src/main/jniLibs/arm64-v8a/libproot.so
        cp data/data/com.termux/files/usr/libexec/proot/loader app/src/main/jniLibs/arm64-v8a/libproot_loader.so
        
        echo "Downloading Alpine..."
        curl -fL -o app/src/main/assets/alpine.tar.gz "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-3.21.3-aarch64.tar.gz"
        
        echo "Verifying downloads..."
        ls -lh app/src/main/jniLibs/arm64-v8a/
        ls -lh app/src/main/assets/

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
