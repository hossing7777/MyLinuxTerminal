<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="xterm.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #000; overflow: hidden; }
        #terminal { width: 100%; height: 100%; padding: 2px; box-sizing: border-box; }
        .xterm-viewport { overflow-y: auto !important; }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script src="xterm.js"></script>
    <script src="xterm-addon-fit.js"></script>
    <script>
        const term = new Terminal({
            cursorBlink: true,
            fontFamily: 'monospace',
            fontSize: 14,
            theme: { background: '#000000', foreground: '#00ff00' }
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();

        // دریافت داده از کاتلین (به صورت Base64) و نوشتن در ترمینال
        window.writeToTerminal = function(base64Data) {
            try {
                const text = atob(base64Data);
                // تبدیل کاراکترهای UTF-8
                const decoded = decodeURIComponent(escape(text));
                term.write(decoded);
            } catch (e) {
                console.error("Decode error", e);
            }
        };

        // ارسال ورودی کاربر به کاتلین
        term.onData(function(data) {
            if (window.AndroidInterface) {
                window.AndroidInterface.postMessage(data);
            }
        });

        window.onresize = function() { fitAddon.fit(); };
    </script>
</body>
</html>
