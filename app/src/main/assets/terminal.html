<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #000; overflow: hidden; }
        #terminal { width: 100%; height: 100%; padding: 5px; box-sizing: border-box; }
        .xterm-viewport { overflow-y: auto !important; }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script>
        const term = new Terminal({
            cursorBlink: true,
            fontFamily: 'monospace',
            fontSize: 14,
            theme: {
                background: '#000000',
                foreground: '#00ff00'
            }
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();

        // دریافت داده از کاتلین و نوشتن در ترمینال
        window.writeToTerminal = function(data) {
            term.write(data);
        };

        // ارسال ورودی کاربر به کاتلین
        term.onData(function(data) {
            if (window.AndroidInterface) {
                window.AndroidInterface.postMessage(data);
            }
        });

        window.onresize = function() {
            fitAddon.fit();
        };
    </script>
</body>
</html>
